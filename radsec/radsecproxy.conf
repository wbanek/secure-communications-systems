# ============================================================================
#  radsecproxy na kontenerze "client" (NAS / access point)
#
#  radtest -> UDP 127.0.0.1:1812 (lokalnie, nie wychodzi z kontenera)
#          -> radsecproxy -> TLS do freeradius:2083 (RadSec)
#
#  Na kablu (eth0) widać więc wyłącznie zaszyfrowany TLS.
# ============================================================================

# Lokalne wejście dla radtest/radclient (auth i accounting)
ListenUDP 127.0.0.1:1812
ListenUDP 127.0.0.1:1813

LogLevel 3

tls lab {
    CACertificateFile  /etc/radsecproxy/pki/ca.pem
    CertificateFile    /etc/radsecproxy/pki/client.pem
    CertificateKeyFile /etc/radsecproxy/pki/client.key
}

# Lokalny "NAS" -> proxy: klasyczny RADIUS/UDP z sekretem
client localhost {
    host 127.0.0.1
    type udp
    secret testing123
}

# Proxy -> FreeRADIUS: RadSec
server freeradius {
    host freeradius
    port 2083
    type tls
    tls lab
    # RFC 6614: stały sekret "radsec"
    secret radsec
    # Nazwa "freeradius" musi być w SAN certyfikatu serwera
    certificateNameCheck on
}

realm * {
    server freeradius
    accountingServer freeradius
}
