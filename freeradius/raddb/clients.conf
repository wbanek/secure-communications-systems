client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = no
	nas_type = other
	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = $ENV{RADIUS_SECRET}
}


client lab_net {
	ipaddr = 172.28.0.0/24
	secret = $ENV{RADIUS_SECRET}
	shortname = lab-docker-net
}

client docker_host_172 {
	ipaddr = 172.16.0.0/12
	secret = $ENV{RADIUS_SECRET}
	shortname = docker-host
}

client docker_host_192 {
	ipaddr = 192.168.0.0/16
	secret = $ENV{RADIUS_SECRET}
	shortname = docker-desktop-host
}
