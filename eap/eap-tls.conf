# EAP-TLS (TLS 1.3, RFC 9190): bez hasła, użytkownik = certyfikat CN=jan
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="jan"
    ca_cert="/etc/radsecproxy/pki/ca.pem"
    client_cert="/etc/radsecproxy/pki/user-jan.pem"
    private_key="/etc/radsecproxy/pki/user-jan.key"
    domain_match="freeradius"
    # włącz TLS 1.3 w wpa_supplicant / eapol_test
    phase1="tls_disable_tlsv1_3=0"
}
