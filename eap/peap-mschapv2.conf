# PEAP-MSCHAPv2: hasło użytkownika z daloRADIUS w tunelu TLS
# (tak loguje się większość laptopów i telefonów do Wi-Fi firmowego / eduroam)
network={
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="jan"
    anonymous_identity="anonymous"
    password="jan123"
    phase2="auth=MSCHAPV2"
    # Klient weryfikuje serwer: zaufane CA + nazwa w certyfikacie
    ca_cert="/etc/radsecproxy/pki/ca.pem"
    domain_match="freeradius"
}
