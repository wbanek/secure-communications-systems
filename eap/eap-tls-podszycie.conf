# Test negatywny: tożsamość "jan", ale certyfikat wystawiony dla "ewa".
# Certyfikat jest ważny (nasze CA), więc TLS by przeszedł - odrzuca go
# check_cert_cn = %{User-Name} w mods-available/eap.
network={
    key_mgmt=WPA-EAP
    eap=TLS
    identity="jan"
    ca_cert="/etc/radsecproxy/pki/ca.pem"
    client_cert="/etc/radsecproxy/pki/user-ewa.pem"
    private_key="/etc/radsecproxy/pki/user-ewa.key"
    domain_match="freeradius"
    phase1="tls_disable_tlsv1_3=0"
}
